<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer | PALM Ministry</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/images/logo.png" type="image/png">
</head>
<body data-page="volunteer">

  <header class="site-header" id="site-header"></header>

  <div class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Volunteer</div>
      <h1 data-i18n="volunteer_title">Volunteer With PALM</h1>
      <p class="amharic-title">ተ volunteers ይሁኑ</p>
      <p class="subtitle" data-i18n="volunteer_subtitle">Offer your time, skills, and passion to advance peace and justice in Ethiopia.</p>
    </div>
  </div>

  <section>
    <div class="container" style="max-width:720px;">
      <div class="form-section reveal">
        <form data-form="volunteer">
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="mem_name">Full Name</label>
              <input type="text" name="name" required>
            </div>
            <div class="form-group">
              <label data-i18n="mem_phone">Phone Number</label>
              <input type="tel" name="phone" required>
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="mem_email">Email Address</label>
            <input type="email" name="email" required>
          </div>
          <div class="form-group">
            <label>How would you like to volunteer?</label>
            <div class="volunteer-options">
              <label class="volunteer-option"><input type="checkbox" name="area" value="training"> Leadership Training Support</label>
              <label class="volunteer-option"><input type="checkbox" name="area" value="green"> Green Day / Tree Planting</label>
              <label class="volunteer-option"><input type="checkbox" name="area" value="football"> Football Team / Youth</label>
              <label class="volunteer-option"><input type="checkbox" name="area" value="media"> Media & Communications</label>
              <label class="volunteer-option"><input type="checkbox" name="area" value="counseling"> Counseling / Advocacy (Professional)</label>
              <label class="volunteer-option"><input type="checkbox" name="area" value="admin"> Admin & Operations</label>
            </div>
          </div>
          <div class="form-group">
            <label>Skills & Experience</label>
            <textarea name="skills" rows="4" placeholder="Tell us about your skills and availability..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" data-i18n="submit">Submit Application</button>
        </form>
        <div class="success-message form-success">
          <h3>Thank You!</h3>
          <p>Your volunteer application has been received. We'll contact you with next steps.</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
